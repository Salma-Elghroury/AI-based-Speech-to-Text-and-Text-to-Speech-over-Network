<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f2">
    <title>Send an image — Relay</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="../index.html" aria-label="Relay home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32"><path d="M7 16h18M18 8l8 8-8 8"/></svg>
                </span>
                <span>relay<span class="brand-dot">.</span></span>
            </a>
        </header>

        <main class="workflow-main image-workflow">
            <a class="back-link" href="../index.html"><span aria-hidden="true">←</span> All message types</a>
            <section class="workflow-heading">
                <p class="eyebrow"><span class="eyebrow-line"></span> IMAGE MESSAGE</p>
                <h1>Show us what<br><span class="text-accent">you mean.</span></h1>
                <p class="hero-description">Choose an image from your device. It will only be sent when you say so.</p>
            </section>

            <section class="record-card image-card" aria-labelledby="imageTitle">
                <div class="record-card-top">
                    <div>
                        <p class="section-kicker">YOUR IMAGE</p>
                        <h2 id="imageTitle">A picture says a lot</h2>
                    </div>
                    <span class="image-file-type">JPG · PNG · WEBP</span>
                </div>
                <input id="imageInput" class="visually-hidden" type="file" accept="image/*">
                <label class="image-dropzone" id="dropzone" for="imageInput">
                    <span class="dropzone-placeholder" id="dropzonePlaceholder">
                        <span class="upload-icon" aria-hidden="true">
                            <svg viewBox="0 0 48 48"><path d="M24 32V10m-8 8 8-8 8 8"/><path d="M10 28v9a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3v-9"/></svg>
                        </span>
                        <span class="dropzone-title">Drop one image here</span>
                        <span class="dropzone-subtitle">or <span>browse your files</span></span>
                    </span>
                </label>
                <div class="upload-confirmation" id="uploadConfirmation" role="status" aria-live="polite" hidden>
                    <span class="upload-confirmation-icon" aria-hidden="true">✓</span>
                    <span class="upload-confirmation-copy">
                        <strong>Image added</strong>
                        <span class="selected-file" id="selectedFile"></span>
                    </span>
                    <button class="change-image-button" id="changeImageButton" type="button">Change</button>
                </div>
                <p class="dialog-error" id="imageError" role="alert"></p>
                <button class="button button-primary image-send-button" id="sendImageButton" type="button" disabled>
                    Send image
                </button>
            </section>
        </main>
    </div>
    <script type="module" src="./image.js"></script>
</body>
</html>
